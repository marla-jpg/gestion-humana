/* adaptador de datos: misma interfaz que usa la app (colecciones y documentos) */
function crearDb(cli){ const T={}; ["empleados","cargos","config"].forEach(t=>T[t]={rows:new Map(),subs:[],cargado:false});
  const err=e=>({code:/row-level security|permission|42501/i.test((e&&(e.message||e.code))||"")?"invalid_argument":/JWT|token/i.test((e&&e.message)||"")?"revoked":"unavailable",message:(e&&e.message)||""});
  function aviso(t){ for(const s of T[t].subs){ try{ if(s.col) s.cb({docs:[...T[t].rows].map(([id,d])=>({id,exists:true,data:()=>d}))}); else { const d=T[t].rows.get(s.id); s.cb({id:s.id,exists:!!d,data:()=>d}); } }catch(e){ console.error(e); } } }
  async function cargar(t){ const out=new Map(); let desde=0; for(;;){ const {data,error}=await cli.from(t).select("id,data").range(desde,desde+999); if(error) throw err(error); data.forEach(r=>out.set(r.id,r.data||{})); if(data.length<1000) break; desde+=1000; }
    T[t].rows=out; T[t].cargado=true; aviso(t); }
  const sub=(t,s,ecb)=>{ T[t].subs.push(s); if(T[t].cargado) aviso(t); else if(!T[t].cargando){ T[t].cargando=cargar(t).catch(e=>{ T[t].cargando=null; if(ecb) ecb(e); }); } return ()=>{ T[t].subs=T[t].subs.filter(x=>x!==s); }; };
  return { recargar:t=>cargar(t),
    collection:t=>({ onSnapshot:(cb,ecb)=>sub(t,{col:true,cb},ecb) }),
    doc:path=>{ const [t,id]=path.split("/"); return {
      onSnapshot:(cb,ecb)=>sub(t,{id,cb},ecb),
      async set(body){ const {error}=await cli.from(t).upsert({id,data:body,actualizado:new Date().toISOString()}); if(error) throw err(error); T[t].rows.set(id,body); aviso(t); },
      async delete(){ const {error}=await cli.from(t).delete().eq("id",id); if(error) throw err(error); T[t].rows.delete(id); aviso(t); } }; } }; }

/* adaptador de archivos: bucket privado de Supabase Storage */
function crearAssets(cli){ const B=()=>cli.storage.from(BUCKET);
  const err=e=>{ const m=(e&&e.message)||""; return {code:/exceed|too large|size/i.test(m)?"too_large":/mime|type/i.test(m)?"unsupported_type":/row-level|security|unauthor/i.test(m)?"not_granted":/quota/i.test(m)?"quota_or_state":"upstream_error",message:m}; };
  return {
    async upload(blob,opts={}){ const type=opts.type||blob.type||"application/octet-stream"; const id=(uid()+uid()+uid()).slice(0,32);
      const {error}=await B().upload(id,blob,{contentType:type,upsert:false}); if(error) throw err(error); return {id,url:"",sizeBytes:blob.size,contentType:type}; },
    async delete(id){ const {error}=await B().remove([id]); if(error) throw err(error); return {deleted:true}; },
    async list(){ let todo=[],off=0; for(;;){ const {data,error}=await B().list("",{limit:1000,offset:off}); if(error) throw err(error); todo=todo.concat(data||[]); if(!data||data.length<1000) break; off+=1000; }
      const archivos=todo.filter(o=>o&&o.id); return {assets:[],usage:{files:archivos.length,bytes:archivos.reduce((s,o)=>s+((o.metadata&&o.metadata.size)||0),0),maxFiles:0,maxBytes:1073741824}}; } }; }

const descargasNavegador={ async save({filename,data}){ const blob=data instanceof Blob?data:new Blob([data]); const url=URL.createObjectURL(blob);
  const nombreSeguro=String(filename||"archivo").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w .()-]/g,"_"); const a=document.createElement("a"); a.href=url; a.download=nombreSeguro; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); return {status:"saved"}; } };

async function entrar(session){
  S.email=session.user.email; const {data:ok,error}=await sb.rpc("es_autorizado");
  if(error){ S.status="error"; S.errorMsg="No se pudo verificar tu usuario ("+error.message+"). Revisa que el script de configuración se haya ejecutado en Supabase."; ponerUsuario(); return render(); }
  if(!ok){ S.status="noauth"; ponerUsuario(); return render(); }
  S.status="ok"; ocultarUi(false); ponerUsuario();
  S.db=crearDb(sb); S.assets=crearAssets(sb); S.downloads=descargasNavegador;
  S.blob=async id=>{ const {data,error}=await sb.storage.from(BUCKET).download(id); if(error) throw error; return data; };
  render();
  S.db.collection("empleados").onSnapshot(snap=>{ S.emps=snap.docs.map(d=>({id:d.id,...d.data()})); S.loaded=true; if(S.dirty){ S.stale=true; return; } render(); },
    e=>{ S.status="error"; S.errorMsg="No se pudieron cargar los expedientes ("+(e.message||e.code)+")."; render(); });
  S.db.collection("cargos").onSnapshot(snap=>{ S.cargos=snap.docs.map(d=>({id:d.id,...d.data()})); if(S.dirty){ S.stale=true; return; } if(S.loaded) render(); },()=>{});
  S.db.doc("config/general").onSnapshot(s=>{ if(s.exists) S.config={...DEF,...s.data()}; if(!S.dirty&&S.loaded) render(); },()=>{});
  S.assets.list().then(r=>{ S.usage=r.usage; if(S.view==="ajustes"&&!S.dirty) render(); }).catch(()=>{});
  try{ const ch=sb.channel("gh-cambios"); ["empleados","cargos","config"].forEach(t=>ch.on("postgres_changes",{event:"*",schema:"public",table:t},()=>recargarLuego(t))); ch.subscribe(); }catch(_){}
  window.addEventListener("focus",()=>{ ["empleados","cargos"].forEach(recargarLuego); }); }

async function arrancarWeb(){ ocultarUi(true);
  if(!WEB_CFG.url||!WEB_CFG.key){ S.status="setup"; return render(); }
  if(!window.supabase||!window.supabase.createClient){ S.status="error"; S.errorMsg="No cargó la librería de conexión. Revisa tu internet y recarga la página."; return render(); }
  try{ sb=window.supabase.createClient(WEB_CFG.url,WEB_CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}}); }
  catch(e){ S.status="error"; S.errorMsg="Los datos de conexión no son válidos. Revisa la Project URL y la key."; return render(); }
  sb.auth.onAuthStateChange(ev=>{ if(ev==="PASSWORD_RECOVERY"){ S.status="recovery"; render(); } if(ev==="SIGNED_OUT"&&S.status==="ok") location.reload(); });
  const {data,error}=await sb.auth.getSession(); if(error){ S.status="login"; return render(); }
  if(ES_RECUPERACION&&data.session){ S.status="recovery"; return render(); }
  if(!data.session){ S.status="login"; return render(); }
  await entrar(data.session); }

  if(a==="olvide"){ const em=($("#l-email")||{}).value; if(!em){ S.loginMsg="Escribe tu correo arriba y vuelve a pulsar “Olvidé mi contraseña”."; S.loginMsgOk=false; return render(); }
    S.loginEmail=em.trim(); const {error}=await sb.auth.resetPasswordForEmail(S.loginEmail,{redirectTo:location.origin+location.pathname});
    S.loginMsg=error?"No se pudo enviar el correo: "+error.message:"Te enviamos un correo con el enlace para crear una nueva contraseña."; S.loginMsgOk=!error; render(); } });
arrancarWeb();

})();
</script>
